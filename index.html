<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الرقابة على الصرف الصناعي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script>
window.onerror=function(m){var a=document.getElementById('app');if(a)a.insertAdjacentHTML('afterbegin','<div style="padding:12px;color:#c0392b;direction:ltr">'+m+'</div>')};
var SBU=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js','https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js','https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.4/supabase.min.js'];
function loadSB(cb,i){i=i||0;if(window.supabase)return cb();if(i>=SBU.length){document.getElementById('app').innerHTML='<div style="padding:16px">تعذر تحميل مكتبة Supabase. تأكد من الإنترنت أو جرّب شبكة أخرى.</div>';return}var s=document.createElement('script');s.src=SBU[i];s.onload=function(){window.supabase?cb():loadSB(cb,i+1)};s.onerror=function(){loadSB(cb,i+1)};document.head.appendChild(s)}
</script>
<style>
:root{--bg:#f4f6fa;--fg:#14233a;--p:#1b3a63;--pf:#fff;--card:#fff;--bd:#d5dce8;--ok:#1d7a46;--wn:#b7791f;--er:#c0392b;--mut:#5b6b82}
@media(prefers-color-scheme:dark){:root{--bg:#0e1522;--fg:#e6ecf5;--p:#5b8bd0;--pf:#08111f;--card:#16202f;--bd:#2a3850;--ok:#48c27c;--wn:#e0a840;--er:#ef6b5b;--mut:#9aa9c0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Cairo,Tahoma,sans-serif;font-size:16px;padding:env(safe-area-inset-top) 0 80px}
header{background:var(--p);color:var(--pf);padding:10px 14px;display:flex;align-items:center;gap:8px}
header b{flex:1}header button{background:none;border:1px solid var(--pf);color:var(--pf);border-radius:8px;padding:6px 10px;font:inherit}
main{padding:12px;max-width:720px;margin:auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:11px;min-height:46px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:10px;background:var(--p);color:var(--pf);font:inherit;font-weight:600;margin-top:10px}
.btn.s{background:none;color:var(--p);border:1px solid var(--p)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{padding:10px 0;border-bottom:1px solid var(--bd)}.m{color:var(--mut);font-size:14px}
.tag{padding:2px 10px;border-radius:12px;font-size:13px;color:#fff}.w{background:var(--wn)}.o{background:var(--ok)}.e{background:var(--er)}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:56px;border:0;background:none;color:var(--mut);font:inherit}nav button.on{color:var(--p);font-weight:800}
.bad{color:var(--er);border-color:var(--er)}pre{white-space:pre-wrap;direction:ltr;text-align:left;font-size:12px}
</style>
</head>
<body>
<div id="app"><p style="padding:16px">جارٍ التحميل…</p></div>
<script>
const SB_URL='https://slnptitbvpxdbhnzftfl.supabase.co';
const SB_KEY='sb_publishable_6UVxLGRkeDvQanZvsYhrSQ_NQAPKDe1';
let sb;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROLES={gm:'المدير العام',rq:'مدير الرقابة',ctl:'مدير التحكم',col:'مدير التحصيل',lic:'مدير التراخيص',insp:'فريق المعاينات'};
const ST={pending:['في الانتظار','w'],pass:['مطابقة','o'],fail:['غير مطابقة','e']};
let me=null,BR=[],LIM={},V='fac';
const today=()=>new Date().toISOString().slice(0,10);
const rnd=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
const err=e=>alert('خطأ: '+(e.message||e));

async function boot(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return loginUI();
  const{data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(error)return $('#app').innerHTML=`<main><div class="c bad">تعذر الاتصال: ${esc(error.message)}<br>تأكد من تشغيل ملف SQL.</div></main>`;
  if(!p)return $('#app').innerHTML=`<main><div class="c"><h3>الحساب غير مفعّل بعد</h3><p>اطلب من المدير العام تفعيله. رقم الحساب:</p><pre>${session.user.id}</pre><button class="btn s" onclick="out()">خروج</button></div></main>`;
  me=p;
  BR=(await sb.from('branches').select('*').order('id')).data||[];
  LIM=Object.fromEntries(((await sb.from('lab_limits').select('*')).data||[]).map(x=>[x.param,x]));
  go('fac');
}
function loginUI(){$('#app').innerHTML=`<main><div class="c"><h2>الرقابة على الصرف الصناعي</h2><label>البريد الإلكتروني</label><input id="em" type="email" dir="ltr"><label>كلمة المرور</label><input id="pw" type="password" dir="ltr"><button class="btn" onclick="login()">دخول</button></div></main>`}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return err(error);boot()}
async function out(){await sb.auth.signOut();me=null;loginUI()}

function shell(body){
  $('#app').innerHTML=`<header><b>${esc(me.full_name)} · ${ROLES[me.role]}</b><button onclick="out()">خروج</button></header><main>${body}</main>
  <nav>${[['fac','المنشآت'],['new','معاينة جديدة'],['samp','العينات']].map(([k,t])=>`<button class="${k==V?'on':''}" onclick="go('${k}')">${t}</button>`).join('')}</nav>`}
async function go(v,arg){V=v;shell('<p class="m">جارٍ التحميل…</p>');
  try{shell(await R[v](arg))}catch(e){shell(`<div class="c bad">${esc(e.message||e)}</div>`)}}

const R={
async fac(){const{data,error}=await sb.from('facilities').select('id,code,name,address,classification,branch_id,monthly_water_m3').is('deleted_at',null).order('registered_at',{ascending:false}).limit(200);
  if(error)throw error;
  return`<div class="c">${(data||[]).map(f=>`<div class="row"><b>${esc(f.name)}</b> <span class="m">${esc(f.code)}</span><br><span class="m">${esc(BR.find(b=>b.id==f.branch_id)?.name)}، ${esc(f.classification)}${f.monthly_water_m3?'':' · لا استهلاك مسجل'}</span></div>`).join('')||'<span class="m">لا توجد منشآت</span>'}</div>`},
async new(){
  if(!['gm','rq','insp'].includes(me.role))return'<div class="c">غير مصرّح لدورك بإنشاء معاينات</div>';
  const o=a=>a.map(x=>`<option>${x}</option>`).join('');
  return`<div class="c"><h3>معاينة جديدة</h3>
  <label>سبب المعاينة</label><select id="rs">${o(['طلب توصيل','خطة الإدارة','مسح'])}</select>
  <label>الفرع</label><select id="br">${BR.map(b=>`<option value="${b.id}" ${me.branch_id==b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>
  <label>اسم المنشأة *</label><input id="nm"><label>العنوان</label><input id="ad"><label>اسم المالك *</label><input id="ow">
  <div class="g"><div><label>التصنيف *</label><select id="cl">${o(['','تجارية','صناعية','أخرى'])}</select></div><div><label>النشاط</label><input id="ac"></div>
  <div><label>مصدر المياه</label><select id="ws">${o(['حكومي','جوفي','حكومي وجوفي'])}</select></div><div><label>الاستهلاك الشهري م³</label><input id="wm" type="number" min="0"></div></div>
  <label>رقم حساب العميل (للحكومي)</label><input id="ca">
  <div class="g"><div><label>نوعية الصرف</label><select id="dt">${o(['صناعي','آدمي','خليط'])}</select></div><div><label>جهة التوصيل</label><select id="cn">${o(['على الشبكة','كسح تابع للشركة','كسح تابع لجهة خارج الشركة'])}</select></div></div>
  <label>عدد العينات</label><input id="sc" type="number" min="0" max="10" value="1" oninput="smp()"><div id="sl"></div>
  <label>ملاحظات</label><textarea id="nt" rows="2"></textarea><button class="btn" onclick="saveInsp()">اعتماد وحفظ</button></div>`},
async samp(){const{data,error}=await sb.from('samples').select('id,code,status,collected_on,sample_type,facilities(name)').order('collected_on',{ascending:false}).limit(200);if(error)throw error;
  return`<div class="c">${(data||[]).map(s=>`<div class="row" onclick="go('res','${s.id}')"><b>${esc(s.code)}</b> <span class="tag ${ST[s.status][1]}">${ST[s.status][0]}</span><br><span class="m">${esc(s.facilities?.name)}، ${s.collected_on}، ${esc(s.sample_type)}</span></div>`).join('')||'<span class="m">لا توجد عينات</span>'}</div>`},
async res(id){const{data:s}=await sb.from('samples').select('*,facilities(name)').eq('id',id).single();
  const{data:r}=await sb.from('lab_results').select('*').eq('sample_id',id).order('received_on',{ascending:false}).limit(1);const x=(r&&r[0])||{};
  const F=[['temp','الحرارة °م'],['ph','pH'],['bod','BOD'],['cod','COD'],['tss','TSS'],['og','زيوت وشحوم'],['settle10','راسبة 10 د'],['settle15','راسبة 15 د']];
  const can=me.role!=='lic'&&me.role!=='col'&&me.role!=='ctl'&&(['gm','rq'].includes(me.role)||me.job_title==='كيميائي');
  return`<button class="btn s" onclick="go('samp')">رجوع</button><div class="c"><h3>${esc(s.code)} <span class="tag ${ST[s.status][1]}">${ST[s.status][0]}</span></h3><span class="m">${esc(s.facilities?.name)}</span>
  <div class="g">${F.map(([k,t])=>`<div><label>${t}</label><input id="r_${k}" type="number" step="any" value="${x[k]??''}" ${can?'':'disabled'}></div>`).join('')}</div>
  ${can?`<button class="btn" onclick="saveRes('${id}')">حفظ وتقييم</button>`:'<p class="m">الإدخال للكيميائي ومدير الرقابة والمدير العام</p>'}</div>`}};

function smp(){const n=Math.min(10,+$('#sc').value||0);$('#sl').innerHTML=Array.from({length:n},(_,i)=>`<div class="g"><div><label>نوع العينة ${i+1}</label><select class="st"><option>بسيطة</option><option>مركبة</option></select></div><div><label>المخرج</label><input class="so"></div></div>`).join('')}
async function saveInsp(){try{
  const v=i=>$('#'+i).value.trim(),br=+v('br'),b=BR.find(x=>x.id==br);
  if(!v('nm')||!v('ow')||!v('cl'))return alert('أكمل: اسم المنشأة والمالك والتصنيف');
  if(v('ws')!=='جوفي'&&!v('ca'))return alert('رقم حساب العميل إجباري للمصدر الحكومي');
  if(v('cn')==='كسح تابع لجهة خارج الشركة'){await sb.from('inspections').insert({reason:v('rs'),branch_id:br,inspector_id:me.id,status:'cancelled',notes:'لا يتم التعامل مع هذه المنشأة: '+v('nm')});alert('لا يتم التعامل مع هذه المنشأة، وتُعتبر المعاينة كأن لم تكن.');return go('fac')}
  let{data:f}=await sb.from('facilities').select('id,code').eq('branch_id',br).eq('name',v('nm')).eq('owner_name',v('ow')).is('deleted_at',null).maybeSingle();
  if(f){if(!confirm('المنشأة مسجلة سابقاً، هل تريد ربط المعاينة بها؟'))return}
  else{const{data:code,error:e1}=await sb.rpc('next_facility_code',{b:br});if(e1)throw e1;
    const{data,error}=await sb.from('facilities').insert({code,branch_id:br,name:v('nm'),address:v('ad'),owner_name:v('ow'),classification:v('cl'),activity:v('ac'),water_source:v('ws'),customer_account:v('ca')||null,discharge_type:v('dt'),connection_type:v('cn'),monthly_water_m3:+v('wm')||null}).select('id,code').single();if(error)throw error;f=data}
  const{data:ins,error:e2}=await sb.from('inspections').insert({facility_id:f.id,reason:v('rs'),branch_id:br,inspector_id:me.id,status:'approved',notes:v('nt')}).select('id').single();if(e2)throw e2;
  const t=[...document.querySelectorAll('.st')].map(e=>e.value),o=[...document.querySelectorAll('.so')].map(e=>e.value);
  if(t.length){const d=today().replace(/-/g,'').slice(2);const{error:e3}=await sb.from('samples').insert(t.map((x,i)=>({code:`${b.code}-${d}-${rnd()}`,inspection_id:ins.id,facility_id:f.id,sample_type:x,outlet:o[i]})));if(e3)throw e3}
  alert('تم الحفظ. كود المنشأة: '+f.code);go('fac')}catch(e){err(e)}}
async function saveRes(id){try{
  const g=k=>{const x=$('#r_'+k).value;return x===''?null:+x},v={temp:g('temp'),ph:g('ph'),bod:g('bod'),cod:g('cod'),tss:g('tss'),og:g('og'),settle10:g('settle10'),settle15:g('settle15')};
  const bad=[['bod','BOD'],['tss','TSS'],['cod','COD'],['og','OG']].some(([k,p])=>v[k]!=null&&LIM[p]?.max_value!=null&&v[k]>LIM[p].max_value)||(v.ph!=null&&LIM.pH&&(v.ph>LIM.pH.max_value||v.ph<LIM.pH.min_value));
  const{error}=await sb.from('lab_results').insert({sample_id:id,...v,received_on:today(),entered_by:me.id});if(error)throw error;
  const{error:e2}=await sb.from('samples').update({status:bad?'fail':'pass'}).eq('id',id);if(e2)throw e2;go('res',id)}catch(e){err(e)}}
loadSB(function(){sb=supabase.createClient(SB_URL,SB_KEY);boot()});
</script>
</body>
</html>
