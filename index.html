<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الرقابة على الصرف الصناعي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--fg:#14233a;--p:#1b3a63;--pf:#fff;--card:#fff;--bd:#d5dce8;--ok:#1d7a46;--wn:#b7791f;--er:#c0392b;--mut:#5b6b82;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--fg:#e6ecf5;--p:#5b8bd0;--pf:#08111f;--card:#16202f;--bd:#2a3850;--ok:#48c27c;--wn:#e0a840;--er:#ef6b5b;--mut:#9aa9c0}}
:root[data-theme="dark"]{--bg:#0e1522;--fg:#e6ecf5;--p:#5b8bd0;--pf:#08111f;--card:#16202f;--bd:#2a3850;--ok:#48c27c;--wn:#e0a840;--er:#ef6b5b;--mut:#9aa9c0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Cairo,Tahoma,sans-serif;font-size:16px;padding-bottom:76px}
header{background:var(--p);color:var(--pf);padding:10px 14px;display:flex;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{flex:1;font-size:17px}
select,input,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);min-height:46px}
header select{width:auto;max-width:48%;min-height:38px;padding:4px 8px}
main{padding:12px;max-width:720px;margin:auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:17px;color:var(--p)}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 3px}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:10px;background:var(--p);color:var(--pf);font:inherit;font-weight:600;margin-top:10px;cursor:pointer}
.btn.s{background:transparent;color:var(--p);border:1px solid var(--p)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.n{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.n div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center}
.n strong{display:block;font-size:26px;color:var(--p)}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1 0 auto;padding:0 12px;min-height:58px;border:0;background:none;color:var(--mut);font:inherit;font-size:13px}
nav button.on{color:var(--p);font-weight:800;border-top:3px solid var(--p)}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:13px;color:#fff}
.w{background:var(--wn)}.o{background:var(--ok)}.e{background:var(--er)}
.bad{border-color:var(--er)!important;color:var(--er)}
.row{padding:10px 0;border-bottom:1px solid var(--bd)}
.m{color:var(--mut);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:start}
.hide{display:none}
#pv{position:fixed;inset:0;background:#fff;color:#000;z-index:50;overflow:auto;padding:12px}#pv table td,#pv table th{border:1px solid #888}@media print{body>*:not(#pv){display:none!important}.np{display:none!important}}
</style>
</head>
<body>
<header><b>الرقابة على الصرف الصناعي</b><select id="role" onchange="S.role=this.value;save();go(S.v)"></select></header>
<main id="m"></main>
<nav id="nav"></nav>
<script>
const BR=['بنها','مركز بنها','طوخ','كفر شكر','قها','قليوب','شبين القناطر','القناطر الخيرية','الخصوص','غرب شبرا','شمال الخانكة','جنوب الخانكة'];
const ROLES={gm:'المدير العام',rq:'مدير إدارة الرقابة',ctl:'مدير إدارة التحكم',col:'مدير إدارة التحصيل',lic:'مدير إدارة التراخيص',tech:'معاين: فني',eng:'معاين: مهندس',chem:'معاين: كيميائي'};
const NAV={home:['الرئيسية',1],new:['معاينة',['gm','rq','tech','eng','chem']],plan:['الخطة',['gm','rq','tech','eng','chem']],fac:['المنشآت',1],samp:['العينات',1],claims:['المطالبات',['gm','rq','ctl','col']],coll:['التحصيل',['gm','ctl','col']],lic:['التراخيص',['gm','rq','lic']],set:['الإعدادات',['gm']],test:['اختبارات',1]};
const FEE0={cm:100,ind:300,trans:0,vat:14,gw:6,ratio:80,cod:40};
const LIM0={BOD:600,TSS:800,COD:1100,OG:100,phLo:6,phHi:9.5};
let S=null;try{S=JSON.parse(localStorage.getItem('ind1'))}catch(e){}
if(!S)S={role:'gm',v:'home',br:BR.map((n,i)=>({n,code:i+1})),cnt:{},fac:[],samp:[],canc:[],audit:[],lim:LIM0,fee:FEE0,labs:['معمل 1','معمل 2','معمل 3'],draft:null,pc:0,sc:0};
const save=()=>{try{localStorage.setItem('ind1',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const log=(a,f,o,n)=>{S.audit.unshift({u:ROLES[S.role],t:new Date().toLocaleString('ar-EG'),a,f,o,n});save()};
const pv=(r,k)=>{if(r==='gm'&&k==='set')return true;const o=S.pm&&S.pm[r+':'+k];if(o!=null)return o;const x=NAV[k][1];return x===1||x.includes(r)};
const can=k=>pv(S.role,k);
const canRes=()=>['gm','rq','chem'].includes(S.role);
const ST={wait:['في الانتظار','w'],ok:['مطابقة','o'],bad:['غير مطابقة','e']};
const rnd=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
const r2=x=>Math.round(x*100)/100,fm=x=>r2(x).toLocaleString('ar-EG');
const brc=i=>S.br[i].code;

/* ===== محرك حساب أعباء التنقية: [من, إلى, فئة, مهلة بالشهور, نطاق محطة؟] ===== */
const I=Infinity;
const TI={BOD:[[244,600,1,6,1],[600,660,3,6],[660,2000,9,3],[2000,I,18,.5]],
TSS:[[339,800,.5,6,1],[800,880,2,6],[880,3000,5,3],[3000,I,15,.25]],
COD:[[1100,2000,6,3],[2000,5000,18,2],[5000,I,30,.25]],
OG:[[100,1000,10,1],[1000,I,25,.5]]};
function tier(p,v){return (TI[p]||[]).find(t=>v>t[0]&&v<=t[1])}
function calc(v,water,conf){
 const L=[];const both=v.BOD>S.lim.BOD&&v.COD>S.lim.COD;
 for(const p of['BOD','TSS','COD','OG']){
  if(v[p]==null||v[p]==='')continue;const t=tier(p,+v[p]);if(!t||(t[4]&&!conf))continue;
  const mult=Math.max(1,t[3]);let val=water*mult*t[2];
  L.push({p,v:v[p],rate:t[2],mult,val});
  if(p==='COD'&&both)L.push({p:'خصم COD',v:'',rate:'',mult:'',val:-val*S.fee.cod/100});}
 if(v.ph!=null&&v.ph!==''){const h=+v.ph;let r=0,m=0;
  if(h<2||h>12){r=60;m=1}else if(h<S.lim.phLo||h>S.lim.phHi){r=30;m=1}
  if(r)L.push({p:'pH',v:h,rate:r,mult:m,val:water*m*r})}
 return{L,total:r2(L.reduce((a,x)=>a+x.val,0))}}
const inspFee=(cls,trans)=>r2((cls==='تجارية'?S.fee.cm:S.fee.ind)+ +trans)*(1+S.fee.vat/100);
const gwFee=(d,days)=>d*days*S.fee.gw*(1+S.fee.vat/100);

/* ===== التقييم ===== */
function evalRes(v){const l=S.lim,bad=[];
 const n=k=>v[k]===''||v[k]==null?null:+v[k];
 for(const k of['BOD','TSS','COD','OG'])if(n(k)!=null&&n(k)>l[k])bad.push(k);
 if(n('ph')!=null&&(n('ph')<l.phLo||n('ph')>l.phHi))bad.push('ph');
 return bad}

/* ===== التنقل ===== */
function go(v){S.v=v;save();
 $('#role').innerHTML=Object.entries(ROLES).map(([k,x])=>`<option value="${k}" ${k==S.role?'selected':''}>${x}</option>`).join('');
 $('#nav').innerHTML=Object.keys(NAV).filter(can).map(k=>`<button class="${k==v?'on':''}" onclick="go('${k}')">${NAV[k][0]}</button>`).join('');
 const bv=String(v).split(':')[0];if(NAV[bv]&&!can(bv)){S.v=v='home'}
 const[vw,arg]=String(v).split(':');$('#m').innerHTML=V[vw](arg);if(vw==='new')initForm();scrollTo(0,0)}

const tag=s=>`<span class="tag ${ST[s][1]}">${ST[s][0]}</span>`;
const V={
home(){const w=S.samp.filter(x=>x.st==='wait').length,b=S.samp.filter(x=>x.st==='bad').length;
 return`<div class="c"><h3>مرحباً، ${ROLES[S.role]}</h3><span class="m">المرحلة 1: الأساس. الخطة والتراخيص والمطالبات والتحصيل في المراحل التالية.</span></div>
 <div class="n"><div><strong>${S.fac.length}</strong>منشآت مسجلة</div><div><strong>${S.samp.length}</strong>عينات</div><div><strong>${w}</strong>في الانتظار</div><div><strong>${b}</strong>غير مطابقة</div><div><strong>${S.canc.length}</strong>معاينات ملغاة</div><div><strong>${S.draft?1:0}</strong>مسودة محفوظة</div></div>
 ${can('new')?`<button class="btn" onclick="go('new')">معاينة جديدة</button>`:''}
 ${S.canc.length&&['gm','rq'].includes(S.role)?`<div class="c" style="margin-top:12px"><h3>معاينات ملغاة</h3>${S.canc.map(c=>`<div class="row">${c.name}، ${BR[c.br]}<br><span class="m">${c.d}</span></div>`).join('')}</div>`:''}`},
new(){const o=a=>a.map(x=>`<option>${x}</option>`).join('');
 return`<form id="f" onsubmit="return false" oninput="onIn()" onchange="onIn()">
 <div class="c"><h3>بيانات المعاينة</h3><label>سبب المعاينة</label><select name="reason">${o(['طلب توصيل','خطة الإدارة','مسح'])}</select>
 <div class="g"><div><label>التاريخ</label><input type="date" name="d" value="${new Date().toISOString().slice(0,10)}"></div><div><label>الفرع</label><select name="br">${S.br.map((b,i)=>`<option value="${i}">${b.n} (${b.code})</option>`).join('')}</select></div></div></div>
 <div class="c"><h3>بيانات المنشأة</h3>
 <label>اسم المنشأة *</label><input name="name"><label>العنوان</label><input name="addr"><button type="button" class="btn s" onclick="gps()">تحديد موقعي GPS</button>
 <label>اسم المالك *</label><input name="owner"><label>اسم المستأجر</label><input name="tenant">
 <div class="g"><div><label>التصنيف *</label><select name="cls">${o(['','تجارية','صناعية','أخرى'])}</select></div><div><label>نوع النشاط</label><input name="act"></div>
 <div><label>عدد العاملين</label><input type="number" min="0" name="workers"></div><div><label>عدد الورديات</label><input type="number" min="0" name="shifts"></div>
 <div><label>أيام العمل بالشهر</label><input type="number" min="1" max="31" name="days"></div><div><label>متوسط الاستهلاك الشهري (م³)</label><input type="number" min="0" name="water"></div></div>
 <label>اسم المسؤول وهاتفه</label><input name="mgr"></div>
 <div class="c"><h3>مصادر المياه</h3><select name="src">${o(['حكومي فقط','جوفي فقط','حكومي وجوفي معاً'])}</select>
 <div id="gv"><label>رقم حساب العميل *</label><input name="acct"></div>
 <div id="gw" class="hide"><label>عدد الطلمبات</label><input type="number" min="0" max="20" name="pc"><div id="pr"></div></div></div>
 <div class="c"><h3>الصرف</h3><div class="g"><div><label>نوعية الصرف</label><select name="dt">${o(['صناعي','آدمي','خليط'])}</select></div>
 <div><label>جهة التوصيل</label><select name="dest">${o(['على الشبكة','كسح تابع للشركة','كسح تابع لجهة خارج الشركة'])}</select></div></div>
 <p id="ext" class="bad hide"><b>لا يتم التعامل مع هذه المنشأة، وتُعتبر المعاينة كأن لم تكن.</b></p></div>
 <div class="c" id="sm"><h3>العينات</h3><label>عدد العينات</label><input type="number" min="0" max="10" name="sc"><div id="sr"></div></div>
 <div class="c"><h3>الختام</h3><label>ملاحظات المعاين</label><textarea name="notes" rows="3"></textarea><span class="m">المعاين: ${ROLES[S.role]}</span>
 <button class="btn s" type="button" onclick="saveDraft(1)">حفظ كمسودة</button><button class="btn" type="button" onclick="approve()">اعتماد وحفظ</button></div></form>`},
fac(){return`<input placeholder="بحث بالاسم أو الكود أو العنوان" oninput="fq(this.value)" style="margin-bottom:10px"><div id="fl">${facList('')}</div>`},
fd(id){const f=S.fac.find(x=>x.id==id),ss=S.samp.filter(s=>s.fid==id);
 return`<button class="btn s" onclick="go('fac')">رجوع</button><div class="c"><h3>${f.name} <span class="m">كود ${f.code}</span></h3>
 <div class="row">${f.addr||'-'}<br>المالك: ${f.owner} | ${f.cls} | ${BR[f.br]}</div><div class="row">المصدر: ${f.src} | الصرف: ${f.dt}، ${f.dest}<br>الاستهلاك الشهري: ${f.water||'غير مسجل'} م³</div>
 ${S.fac&&f?'<div class="row">مسؤول المطالبات: '+offc(f.br)+'</div>':''}${f.water?'':'<div class="row bad">تنبيه: لا يوجد استهلاك مسجل، لن تُنشأ مسودة أعباء.</div>'}</div>
 <div class="c"><h3>الزيارات</h3>${f.visits.map(v=>`<div class="row">${v.d}، ${v.reason}</div>`).join('')}</div>
 <div class="g"><button class="btn s" onclick="mkIns(${f.id})">مطالبة معاينة</button><button class="btn s" onclick="stmt(${f.id})">كشف حساب</button>${f.src!=='حكومي فقط'?`<button class="btn s" onclick="mkGw(${f.id})">مطالبة جوفي</button><button class="btn s" onclick="gwRep(${f.id})">تقرير جوفي</button>`:''}</div><button class="btn s" onclick="delF(${f.id})">حذف (نقل للأرشيف)</button><div class="c"><h3>العينات</h3>${ss.map(s=>`<div class="row" onclick="go('sd:${s.id}')">${s.id} ${tag(s.st)}</div>`).join('')||'<span class="m">لا توجد عينات</span>'}</div>`},
samp(){return`<div class="c">${S.samp.map(s=>{const f=S.fac.find(x=>x.id==s.fid);return`<div class="row" onclick="go('sd:${s.id}')"><b>${s.id}</b> ${tag(s.st)}<br><span class="m">${f.name}، ${s.d}، ${s.lab}، ${s.type}</span></div>`}).join('')||'<span class="m">لا توجد عينات بعد</span>'}</div>`},
sd(id){const s=S.samp.find(x=>x.id===id),f=S.fac.find(x=>x.id==s.fid),r=s.res||{},bad=s.res?evalRes(r):[];
 const F=[['temp','الحرارة °م'],['ph','pH'],['BOD','BOD'],['COD','COD'],['TSS','TSS'],['OG','زيوت وشحوم'],['s10','راسبة 10 د'],['s15','راسبة 15 د']];
 return`<button class="btn s" onclick="go('samp')">رجوع</button><div class="c"><h3>${s.id} ${tag(s.st)}</h3><span class="m">${f.name}، ${s.d}، ${s.lab}، ${s.type}، ${s.outlet||''}</span></div>
 <div class="c" id="rf"><h3>نتائج التحليل</h3><div class="g">${F.map(([k,t])=>`<div><label class="${bad.includes(k)?'bad':''}">${t}</label><input type="number" step="any" name="${k}" value="${r[k]??''}" class="${bad.includes(k)?'bad':''}" ${canRes()?'':'disabled'}></div>`).join('')}</div>
 ${canRes()?'<button class="btn" onclick="saveRes(\''+s.id+'\')">حفظ وتقييم</button>':'<p class="m">صلاحية الإدخال للكيميائي ومدير الرقابة والمدير العام.</p>'}</div>
 ${s.res&&f.water?preview(s,f):''}`},
set(){const k={BOD:'BOD ≤',TSS:'TSS ≤',COD:'COD ≤',OG:'O&G ≤',phLo:'pH من',phHi:'pH إلى'},fk={cm:'معاينة تجارية',ind:'معاينة صناعية/أخرى',trans:'الانتقال',vat:'ضريبة %',gw:'فئة الجوفي ج/م³',ratio:'نسبة التصريف %',cod:'تخفيض COD %',an:'تكلفة تحليل العينة (ج)',vb:'ضريبة على الأعباء (1=نعم)',due:'مدة السداد (يوم)',lt:'مهلة تأخر الطلبات (يوم)'};
 return`<div class="c"><h3>الحدود المسموح بها</h3><div class="g">${Object.keys(k).map(x=>`<div><label>${k[x]}</label><input type="number" step="any" value="${S.lim[x]}" onchange="setv('lim','${x}',this.value)"></div>`).join('')}</div></div>
 <div class="c"><h3>الرسوم والنسب</h3><div class="g">${Object.keys(fk).map(x=>`<div><label>${fk[x]}</label><input type="number" step="any" value="${S.fee[x]??''}" onchange="setv('fee','${x}',this.value)"></div>`).join('')}</div></div>
 <div class="c"><h3>أكواد الفروع</h3><div class="g">${S.br.map((b,i)=>`<div><label>${b.n}</label><input type="number" min="1" value="${b.code}" onchange="setBr(${i},this.value)"></div>`).join('')}</div></div>
 <div class="c"><h3>سجل التغييرات</h3>${S.audit.slice(0,30).map(a=>`<div class="row m">${a.t}، ${a.u}<br>${a.a} ${a.f}: ${a.o??'-'} ← ${a.n??'-'}</div>`).join('')||'<span class="m">لا تغييرات</span>'}</div>
 <div class="c"><h3>المحذوفات</h3>${S.fac.filter(f=>f.del).map(f=>`<div class="row">${f.name} <span class="m">${f.code}</span><div class="g"><button class="btn s" onclick="restF(${f.id})">استعادة</button><button class="btn s" onclick="purge(${f.id})">حذف نهائي</button></div></div>`).join('')||'<span class="m">لا محذوفات</span>'}</div>
 <div class="g"><button class="btn s" onclick="go('bm')">توزيع الفروع على الأعضاء</button><button class="btn s" onclick="go('pmx')">مصفوفة الصلاحيات</button></div>
 <button class="btn" onclick="seed()">تحميل بيانات تجريبية (10 منشآت و15 عينة)</button>
 <button class="btn s" onclick="if(confirm('مسح كل البيانات؟')&&confirm('تأكيد نهائي')){localStorage.removeItem('ind1');location.reload()}">إعادة ضبط التطبيق</button>`},
test(){const w=800,T=[
 ['BOD=300 مطابقة',calc({BOD:300},w,true).total,4800],['TSS=500 مطابقة',calc({TSS:500},w,true).total,2400],
 ['BOD=700 وCOD=1500',calc({BOD:700,COD:1500},w,false).total,30240],['pH=1.5',calc({ph:1.5},w,false).total,48000],
 ['معاينة صناعية + ضريبة',r2(inspFee('صناعية',0)),342],['جوفي 100×20×2',r2(gwFee(100,40)),27360]];
 return`<div class="c"><h3>اختبارات القبول</h3><span class="m">القيم الحالية في الإعدادات</span><table>${T.map(t=>`<tr><td>${t[0]}</td><td>${fm(t[1])}</td><td>${fm(t[2])}</td><td>${t[1]===t[2]?'✓':'✗'}</td></tr>`).join('')}</table></div>`}};

function facList(q){q=q.trim();const l=S.fac.filter(f=>!f.del&&(!q||[f.name,f.code,f.addr,f.owner].join(' ').includes(q)));
 return`<div class="c">${l.map(f=>`<div class="row" onclick="go('fd:${f.id}')"><b>${f.name}</b> <span class="m">${f.code}</span><br><span class="m">${BR[f.br]}، ${f.cls}، ${f.dt}</span></div>`).join('')||'<span class="m">لا توجد منشآت. اعتمد معاينة لتسجيل أول منشأة.</span>'}</div>`}
const fq=q=>$('#fl').innerHTML=facList(q);
function preview(s,f){const w=f.water*S.fee.ratio/100,conf=s.st==='ok',v=s.res,bad=evalRes(v);
 const near=(v.BOD>244&&v.BOD<=S.lim.BOD)||(v.TSS>339&&v.TSS<=S.lim.TSS);
 const c=(conf&&!near)?{L:[],total:0}:calc(v,w,conf);
 return`<div class="c"><h3>معاينة الحساب (المنصرف ${fm(w)} م³)</h3>
