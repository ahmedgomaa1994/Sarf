async samp(){const{data,error}=await sb.from('samples').select('id,code,status,collected_on,sample_type,facilities(name)').order('collected_on',{ascending:false}).limit(200);if(error)throw error;

async function saveInsp(){try{
  const v=i=>$('#'+i).value.trim(),br=+v('br'),b=BR.find(x=>x.id==br);
  if(!v('nm')||!v('ow')||!v('cl'))return alert('أكمل: اسم المنشأة والمالك والتصنيف');

/* ===== المطالبات ===== */
const TL={inspection:'رسوم معاينة وانتقال',analysis_cost:'تكلفة تحليل عينة',treatment_burden:'أعباء تنقية',compliance_notice:'توفيق أوضاع',groundwater:'أحمال مياه جوفية'};

const CST={draft:['مسودة','w'],review:['مراجعة','w'],approved:['معتمدة','o'],print_ready:['جاهزة للطباعة','o']};
const NX={draft:['review',['gm','ctl','rq'],'إرسال للمراجعة'],review:['approved',['gm'],'اعتماد المدير العام'],approved:['print_ready',['gm','ctl','rq'],'جاهزة للطباعة']};
const CY=[['يناير','فبراير'],['مارس','أبريل'],['مايو','يونيو'],['يوليو','أغسطس'],['سبتمبر','أكتوبر'],['نوفمبر','ديسمبر']];
const r2=x=>Math.round((x+Number.EPSILON)*100)/100,fm=x=>r2(+x||0).toLocaleString('ar-EG');
const U=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'],TT=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'],HH=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
const b3=n=>{const p=[],h=n/100|0,r=n%100;if(h)p.push(HH[h]);if(r)p.push(r<20?U[r]:(r%10?U[r%10]+' و':'')+TT[r/10|0]);return p.join(' و')};
const grp=(n,a,b,c,d)=>n===1?a:n===2?b:n<=10?U[n]+' '+c:b3(n)+' '+d;
function words(n){if(!n)return'صفر';const m=n/1e6|0,t=(n/1e3|0)%1e3,r=n%1e3,p=[];if(m)p.push(grp(m,'مليون','مليونان','ملايين','مليوناً'));if(t)p.push(grp(t,'ألف','ألفان','آلاف','ألفاً'));if(r)p.push(b3(r));return p.join(' و')}
function tafq(x){const j=Math.floor(x),q=Math.round((x-j)*100);let s=j===1?'جنيه مصري واحد':j===2?'جنيهان مصريان':words(j)+(j>=3&&j<=10?' جنيهات مصرية':' جنيهاً مصرياً');if(q)s+=' و'+(q===1?'قرش واحد':q===2?'قرشان':words(q)+(q<=10?' قروش':' قرشاً'));return s+' لا غير'}
function evalV(v){const b=[];[['bod','BOD'],['tss','TSS'],['cod','COD'],['og','OG']].forEach(([k,p])=>{if(v[k]!=null&&LIM[p]&&LIM[p].max_value!=null&&v[k]>LIM[p].max_value)b.push(p)});if(v.ph!=null&&LIM.pH&&(v.ph>LIM.pH.max_value||v.ph<LIM.pH.min_value))b.push('pH');return b}
function calcB(v,water,conf){const L=[],both=v.bod>LIM.BOD.max_value&&v.cod>LIM.COD.max_value;
 [['BOD','bod'],['TSS','tss'],['COD','cod'],['OG','og']].forEach(([P,k])=>{const x=v[k];if(x==null)return;
  const t=TIERS.find(t=>t.param===P&&x>+t.from_value&&(t.to_value==null||x<=+t.to_value));if(!t||(t.kind==='plant_input'&&!conf))return;
  const mo=t.grace_unit==='month'?+t.grace_value:+t.grace_value/4,mult=Math.max(1,mo),val=water*mult*+t.rate;
  L.push({p:P,v:x,rate:+t.rate,mult,val});if(P==='COD'&&both)L.push({p:'خصم COD '+FEE.cod_discount_pct+'%',v:'',rate:'',mult:'',val:-val*FEE.cod_discount_pct/100})});
 if(v.ph!=null){const lo=LIM.pH.min_value,hi=LIM.pH.max_value,h=v.ph;let r=0;if(h<2||h>12)r=60;else if(h<lo||h>hi)r=30;if(r)L.push({p:'pH',v:h,rate:r,mult:1,val:water*r})}
 return{L,total:r2(L.reduce((a,x)=>a+x.val,0))}}
async function mkClaim(type,f,lines,extra){
  const{data:serial,error:e0}=await sb.rpc('next_claim_serial',{t:type});if(e0)throw e0;

  const{data:c,error}=await sb.from('claims').insert({type,serial,facility_id:f.id,branch_id:f.branch_id,subtotal:sub,vat,total:r2(sub+vat),settings_snapshot:{fees:FEE,vat_applied:vatOn},created_by:me.id,...extra}).select('id').single();if(error)throw error;
  const{error:e2}=await sb.from('claim_lines').insert(lines.map(l=>({claim_id:c.id,...l})));if(e2)throw e2;return c.id}

const ROLEN={gm:'المدير العام',rq:'مدير الرقابة',ctl:'مدير التحكم',col:'مدير التحصيل',lic:'مدير التراخيص',insp:'فريق المعاينات'};
Object.assign(R,{async set(sec){if(me.role!=='gm')return'<div class="c">للمدير العام فقط</div>';
 if(!sec)return`<div class="c"><h3>الإعدادات</h3>${SETS.map(([k,t])=>`<button class="btn s" onclick="go('set','${k}')">${t}</button>`).join('')}</div>`;
 const back=`<button class="btn s" onclick="go('set')">رجوع</button>`;let b='';
 if(sec==='fee'){const{data}=await sb.from('fee_settings').select('*').order('effective_from',{ascending:false}).order('created_at',{ascending:false}),seen={},cur=[];(data||[]).forEach(x=>{if(!seen[x.key]&&x.effective_from<=today()){seen[x.key]=1;cur.push(x)}});
  b=`<div class="c"><h3>الرسوم والنسب</h3><p class="m">أي تعديل يُحفظ بتاريخ سريان ولا يغيّر المطالبات التي صدرت.</p>${cur.map((x,i)=>`<div class="row"><b>${esc(x.label||x.key)}</b> <span class="m">الحالي: ${x.value??'غير محدد'} (من ${x.effective_from})</span><div class="g"><input id="fv${i}" type="number" step="any" placeholder="القيمة الجديدة"><input id="fd${i}" type="date" value="${today()}"></div><button class="btn s" onclick="saveFee('${x.key}','${esc(x.label||x.key)}',${i})">حفظ</button></div>`).join('')}</div>`}
 else if(sec==='lim')b=`<div class="c"><h3>الحدود المسموح بها</h3>${Object.values(LIM).map(l=>`<div class="row"><b>${esc(l.param)}</b><div class="g"><div><label>الحد الأقصى</label><input type="number" step="any" value="${l.max_value??''}" onchange="updRow('lab_limits','${l.param}','max_value',this.value,'param')"></div><div><label>الحد الأدنى</label><input type="number" step="any" value="${l.min_value??''}" onchange="updRow('lab_limits','${l.param}','min_value',this.value,'param')"></div></div></div>`).join('')}<p class="m">الحرارة والمواد الراسبة بلا حدود افتراضية ولا يترتب عليها حساب مالي.</p></div>`;
 else if(sec==='tier'){const T=TIERS.slice().sort((a,b)=>a.param.localeCompare(b.param)||a.from_value-b.from_value);b=`<div class="c"><h3>شرائح أعباء التنقية</h3>${T.map(t=>`<div class="row"><b>${esc(t.param)}</b> <span class="m">${t.kind==='plant_input'?'نطاق مدخلات المحطة':'مخالفة'}</span><div class="g"><div><label>من (أكبر من)</label><input type="number" step="any" value="${t.from_value}" onchange="updRow('charge_tiers',${t.id},'from_value',this.value)"></div><div><label>إلى (حتى)</label><input type="number" step="any" value="${t.to_value??''}" onchange="updRow('charge_tiers',${t.id},'to_value',this.value)"></div><div><label>الفئة جنيه/م³</label><input type="number" step="any" value="${t.rate}" onchange="updRow('charge_tiers',${t.id},'rate',this.value)"></div><div><label>المهلة</label><div class="g"><input type="number" step="any" value="${t.grace_value}" onchange="updRow('charge_tiers',${t.id},'grace_value',this.value)"><select onchange="updRow('charge_tiers',${t.id},'grace_unit',this.value)"><option value="month" ${t.grace_unit==='month'?'selected':''}>شهر</option><option value="week" ${t.grace_unit==='week'?'selected':''}>أسبوع</option></select></div></div></div></div>`).join('')}<p class="m">pH يُحسب من الحدود: 30 جنيه خارج النطاق حتى 2 أو 12، و60 جنيه أقل من 2 أو أكبر من 12.</p></div>`}
 else if(sec==='br')b=`<div class="c"><h3>الفروع</h3>${BR.map(x=>`<div class="row"><b>${esc(x.name)}</b><div class="g"><div><label>الكود</label><input type="number" min="1" value="${x.code}" onchange="updRow('branches',${x.id},'code',this.value)"></div><label style="display:flex;gap:8px;align-items:center;color:var(--fg)"><input type="checkbox" style="width:22px;min-height:22px" ${x.groundwater_billing_enabled?'checked':''} onchange="updBrGw(${x.id},this.checked)">تحصيل الجوفي</label></div></div>`).join('')}</div>`;
 else if(sec==='usr'){const{data:U}=await sb.from('profiles').select('*').order('full_name'),o=(a,c)=>a.map(([v,t])=>`<option value="${v}" ${v===c?'selected':''}>${t}</option>`).join(''),BO=[['','بدون فرع']].concat(BR.map(x=>[String(x.id),x.name])),JO=[['','—'],['فني','فني'],['مهندس','مهندس'],['كيميائي','كيميائي']],RO=Object.entries(ROLEN);
  b=`<div class="c"><h3>تفعيل مستخدم</h3><p class="m">أنشئ الحساب أولاً من Supabase (Authentication ثم Add user) ثم فعّله هنا ببريده.</p><label>البريد</label><input id="ue" type="email" dir="ltr"><label>الاسم</label><input id="un"><div class="g"><div><label>الدور</label><select id="ur">${o(RO,'insp')}</select></div><div><label>التصنيف</label><select id="uj">${o(JO,'')}</select></div><div><label>الفرع</label><select id="ub">${o(BO,'')}</select></div><div><label>الهاتف</label><input id="up" type="tel"></div></div><button class="btn" onclick="actUser()">تفعيل</button></div>
  <div class="c"><h3>المستخدمون</h3>${(U||[]).map(u=>`<div class="row"><b>${esc(u.full_name)}</b><div class="g"><select onchange="updProf('${u.id}','role',this.value)">${o(RO,u.role)}</select><select onchange="updProf('${u.id}','job_title',this.value)">${o(JO,u.job_title||'')}</select><select onchange="updProf('${u.id}','branch_id',this.value)">${o(BO,u.branch_id==null?'':String(u.branch_id))}</select><label style="display:flex;gap:8px;align-items:center;color:var(--fg)"><input type="checkbox" style="width:22px;min-height:22px" ${u.active?'checked':''} onchange="updProf('${u.id}','active',this.checked)">مفعّل</label></div></div>`).join('')}</div>`}
 else if(sec==='bca'){const{data:U}=await sb.from('profiles').select('id,full_name').eq('active',true).order('full_name'),{data:A}=await sb.from('branch_claim_assignments').select('*'),uo=c=>'<option value="">—</option>'+(U||[]).map(u=>`<option value="${u.id}" ${u.id===c?'selected':''}>${esc(u.full_name)}</option>`).join('');
  b=`<div class="c"><h3>مسؤول مطالبات كل فرع</h3><p class="m">لكل فرع مسؤول أساسي واحد وبديل مؤقت. المسؤول يرى مطالبات فرعه فقط ويصدر مطالبات التحليل والأعباء.</p>${BR.map(x=>{const pr=(A||[]).find(a=>a.branch_id===x.id&&a.is_primary),al=(A||[]).find(a=>a.branch_id===x.id&&!a.is_primary);return`<div class="row"><b>${esc(x.name)}</b><label>الأساسي</label><select onchange="setPrim(${x.id},this.value)">${uo(pr&&pr.user_id)}</select><label>البديل المؤقت</label><select id="au${x.id}">${uo(al&&al.user_id)}</select><div class="g"><input id="af${x.id}" type="date" value="${al?al.valid_from||'':''}"><input id="at${x.id}" type="date" value="${al?al.valid_to||'':''}"></div><button class="btn s" onclick="setAlt(${x.id})">حفظ البديل</button></div>`}).join('')}</div>`}
 else if(sec==='trash'){const{data:F}=await sb.from('facilities').select('id,name,code').not('deleted_at','is',null);b=`<div class="c"><h3>المنشآت المحذوفة</h3>${(F||[]).map(f=>`<div class="row"><b>${esc(f.name)}</b> <span class="m">${esc(f.code)}</span><div class="g"><button class="btn s" onclick="restFac('${f.id}')">استعادة</button><button class="btn s" onclick="purgeFac('${f.id}')">حذف نهائي</button></div></div>`).join('')||'<span class="m">لا توجد محذوفات</span>'}</div>`}
 else{const{data:L,error}=await sb.from('audit_log').select('*').order('at',{ascending:false}).limit(80);if(error)throw error;const{data:U}=await sb.from('profiles').select('id,full_name'),nm=Object.fromEntries((U||[]).map(u=>[u.id,u.full_name]));
  const diff=a=>{if(a.action!=='UPDATE'||!a.old_row||!a.new_row)return a.action==='INSERT'?'إضافة':'حذف';return Object.keys(a.new_row).filter(k=>JSON.stringify(a.new_row[k])!==JSON.stringify(a.old_row[k])).slice(0,4).map(k=>`${esc(k)}: ${esc(String(a.old_row[k]??'-').slice(0,25))} ← ${esc(String(a.new_row[k]??'-').slice(0,25))}`).join('<br>')};
  b=`<div class="c"><h3>سجل التغييرات (آخر 80)</h3>${(L||[]).map(a=>`<div class="row m">${new Date(a.at).toLocaleString('ar-EG')}، ${esc(nm[a.user_id]||'-')}<br><b>${esc(a.table_name)}</b> ${diff(a)}</div>`).join('')||'لا توجد تغييرات'}</div>`}
 return back+b}});
